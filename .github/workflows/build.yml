# Builds GuardYourPhone (phone security check-up) and puts it on a GitHub Release tagged v<version>:
# Android APK (signed with your permanent key when the ANDROID_KEYSTORE_* secrets are set) and an unsigned iPhone .ipa.
# Runs on every push to main, or from Actions → GuardYourPhone app → Run workflow.
name: GuardYourPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: . } }
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm install --no-audit --no-fund
      - name: Create the Android project
        run: |
          set +e; npm run cap:android 2>&1 | tee cap.log; s=${PIPESTATUS[0]}
          if [ $s -ne 0 ]; then echo "::error title=Android project failed::$(tail -n 40 cap.log | tr -d '\r' | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"; fi
          exit $s
      - name: Build and sign the APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTROKE_PASSWORD }}  # also accepts the KEYSTROKE spelling
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          fail() { echo "::error title=Android signing::$1"; exit 1; }
          # Copy-paste often adds spaces or line breaks: strip them (they are never part of these values).
          clean() { printf '%s' "$1" | tr -d ' \r\n\t'; }
          if [ "$HAS_KEYSTORE" = "true" ]; then
            KS_PASS=$(clean "$KS_PASS"); KEY_PASS=$(clean "$KEY_PASS"); KEY_ALIAS=$(clean "$KEY_ALIAS")
            [ -n "$KS_PASS" ] || fail "The secret ANDROID_KEYSTORE_PASSWORD is empty or missing."
            [ -n "$KEY_ALIAS" ] || fail "The secret ANDROID_KEY_ALIAS is empty or missing (the alias of your key, e.g. spot)."
            [ -n "$KEY_PASS" ] || KEY_PASS=$KS_PASS
            clean "$KS_B64" | base64 -d > release.jks 2>/dev/null || fail "ANDROID_KEYSTORE_BASE64 is not valid: paste the whole long line from item 4 again."
            [ -s release.jks ] || fail "ANDROID_KEYSTORE_BASE64 decoded to nothing: paste the whole long line from item 4 again."
            keytool -list -keystore release.jks -storepass "$KS_PASS" >/dev/null 2>&1 || fail "ANDROID_KEYSTORE_PASSWORD doesn't open the keystore (or ANDROID_KEYSTORE_BASE64 is incomplete)."
            keytool -list -keystore release.jks -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1 || fail "ANDROID_KEY_ALIAS is wrong: it must match the key’s alias (e.g. spot)"
            echo "Signing with the permanent key, certificate $(keytool -list -v -keystore release.jks -storepass "$KS_PASS" -alias "$KEY_ALIAS" | grep -m1 'SHA256:' | tr -d ' \t')"
          else
            echo "::warning title=Temporary signing key::Add the ANDROID_KEYSTORE_* secrets so every GuardYourPhone APK is signed with the same permanent key (needed so updates install over the old version)."
            KS_PASS=$(openssl rand -hex 16); KEY_PASS=$KS_PASS; KEY_ALIAS=temp
            keytool -genkeypair -keystore release.jks -storetype PKCS12 -alias temp -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" -dname "CN=GuardYourPhone"
          fi
          ./gradlew assembleRelease --no-daemon
          grep -E 'targetSdkVersion|compileSdkVersion' ../android/variables.gradle 2>/dev/null || grep -E 'targetSdk|compileSdk' variables.gradle || true
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          export KS_PASS KEY_PASS
          $BT/apksigner sign --ks release.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out ../GuardYourPhone.apk aligned.apk \
            || { KEY_PASS=$KS_PASS; $BT/apksigner sign --ks release.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KS_PASS --out ../GuardYourPhone.apk aligned.apk; } \
            || fail "The key couldn't sign the app: check ANDROID_KEY_PASSWORD (it is the same code as ANDROID_KEYSTORE_PASSWORD)."
          $BT/apksigner verify --print-certs ../GuardYourPhone.apk | grep -m1 'SHA-256' || true
          rm -f release.jks aligned.apk
      - uses: actions/upload-artifact@v4
        with: { name: gyp-android, path: GuardYourPhone.apk }

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run cap:ios
      - name: Build unsigned iPhone app (sign it with an Apple Developer account to install)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          set -o pipefail
          xcodebuild $SRC -scheme App -configuration Release -sdk iphoneos -archivePath $PWD/build/GuardYourPhone.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log \
            || { echo "::error title=Xcode build failed::$(grep -E 'error:|BUILD FAILED' build.log | tail -n 25 | tr -d '\r' | sed -e ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          mkdir -p Payload && cp -R build/GuardYourPhone.xcarchive/Products/Applications/App.app Payload/
          zip -qr ../../GuardYourPhone-iPhone-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: gyp-ios, path: GuardYourPhone-iPhone-unsigned.ipa }

  release:
    needs: [android, ios]
    if: always() && github.ref == 'refs/heads/main' && (needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: artifacts, pattern: 'gyp-*', merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: GuardYourPhone ${{ steps.v.outputs.version }}
          make_latest: false
          body: |
            **GuardYourPhone: phone security check-up.** Checks your phone's software, processors and firmware versions, security settings, apps with powerful access and mobile network, and reminds you to restart at 5 am and 7 pm every day. It reads only; it sends nothing anywhere.

            | File | For |
            |---|---|
            | **GuardYourPhone.apk** | Android phones: download, open, and allow "install from this source" when asked |
            | **GuardYourPhone-iPhone-unsigned.ipa** | iPhone: must be signed with an Apple Developer account before it can be installed |
          files: artifacts/*
